<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="circuit divider">
  <defs>
    <linearGradient id="divRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .div-trace { fill: none; stroke: url(#divRule); stroke-width: 1.6; }
    .div-node { fill: #22d3ee; }
    .div-spark { fill: #a5f3fc; }
    .div-breathe { animation: divBreathe 4s ease-in-out infinite; }
    .div-breathe2 { animation: divBreathe 4s ease-in-out 1.4s infinite; }
    .div-breathe3 { animation: divBreathe 4s ease-in-out 2.6s infinite; }
    @keyframes divBreathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>

  <path id="divPath" class="div-trace" d="M0 32 H300 L336 12 H864 L900 32 H1200"/>

  <circle class="div-node" cx="300" cy="32" r="3"/>
  <circle class="div-node" cx="336" cy="12" r="3"/>
  <circle class="div-node" cx="864" cy="12" r="3"/>
  <circle class="div-node" cx="900" cy="32" r="3"/>

  <g filter="url(#divGlow)">
    <circle class="div-breathe" cx="336" cy="12" r="4.5" fill="#22d3ee"/>
    <circle class="div-breathe2" cx="600" cy="12" r="4.5" fill="#22d3ee"/>
    <circle class="div-breathe3" cx="864" cy="12" r="4.5" fill="#22d3ee"/>
    <circle class="div-spark" cx="0" cy="0" r="3">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M0 32 H300 L336 12 H864 L900 32 H1200"/>
    </circle>
  </g>
</svg>