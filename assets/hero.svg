<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Xie Zhibai — on-device AI inference, agent runtime, DSH plugin author">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.45" stop-color="#061426"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="heroRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.82" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0ea5e9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="heroGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .trace { fill: none; stroke: #0ea5e9; stroke-opacity: 0.45; stroke-width: 1.6; }
    .trace-bright { fill: none; stroke: #22d3ee; stroke-opacity: 0.85; stroke-width: 1.8; }
    .node { fill: #22d3ee; }
    .node-dim { fill: #0ea5e9; opacity: 0.5; }
    .pulse { fill: #a5f3fc; }
    .title { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 50px; font-weight: 700; fill: #e0fbff; letter-spacing: 4px; }
    .cn { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; font-size: 30px; fill: #67e8f9; letter-spacing: 2px; }
    .sub { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #38bdf8; letter-spacing: 2.6px; }
    .prompt { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #22d3ee; }
    .caret { animation: heroBlink 1.05s steps(1, end) infinite; }
    .node-pulse-a { animation: heroPulse 3.2s ease-in-out infinite; }
    .node-pulse-b { animation: heroPulse 3.2s ease-in-out 1.1s infinite; }
    .node-pulse-c { animation: heroPulse 3.2s ease-in-out 2.1s infinite; }
    .scan { animation: heroScan 9s linear infinite; }
    @keyframes heroBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes heroPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes heroScan { 0% { transform: translateX(-140px); opacity: 0; } 8% { opacity: 0.55; } 92% { opacity: 0.55; } 100% { transform: translateX(1200px); opacity: 0; } }
  </style>

  <rect width="1200" height="320" fill="url(#heroBg)"/>
  <rect width="1200" height="320" fill="url(#heroGrid)"/>

  <!-- circuit traces -->
  <path class="trace" d="M0 44 H148 L188 84 H352 L382 54 H520"/>
  <path class="trace" d="M1200 44 H1042 L1002 84 H848 L818 54 H700"/>
  <path class="trace" d="M0 276 H210 L250 236 H420"/>
  <path class="trace" d="M1200 276 H980 L940 236 H770"/>
  <path class="trace" d="M0 160 H96"/>
  <path class="trace" d="M1200 160 H1104"/>
  <path class="trace-bright" d="M120 108 H286 L316 138 H700 L730 108 H1080"/>
  <path class="trace-bright" d="M120 212 H400 L430 182 H790 L820 212 H1080"/>

  <!-- nodes -->
  <circle class="node" cx="148" cy="44" r="3.2"/>
  <circle class="node" cx="352" cy="84" r="3.2"/>
  <circle class="node" cx="1042" cy="44" r="3.2"/>
  <circle class="node" cx="848" cy="84" r="3.2"/>
  <circle class="node" cx="210" cy="276" r="3.2"/>
  <circle class="node" cx="420" cy="236" r="3.2"/>
  <circle class="node" cx="980" cy="276" r="3.2"/>
  <circle class="node" cx="770" cy="236" r="3.2"/>
  <circle class="node" cx="286" cy="108" r="3.6"/>
  <circle class="node" cx="700" cy="138" r="3.6"/>
  <circle class="node" cx="1080" cy="108" r="3.6"/>
  <circle class="node" cx="400" cy="212" r="3.6"/>
  <circle class="node" cx="790" cy="182" r="3.6"/>
  <circle class="node" cx="1080" cy="212" r="3.6"/>
  <circle class="node-dim" cx="96" cy="160" r="3"/>
  <circle class="node-dim" cx="1104" cy="160" r="3"/>

  <!-- pulsing nodes with glow -->
  <g filter="url(#heroGlow)">
    <circle class="node-pulse-a" cx="286" cy="108" r="5" fill="#22d3ee"/>
    <circle class="node-pulse-b" cx="700" cy="138" r="5" fill="#22d3ee"/>
    <circle class="node-pulse-c" cx="790" cy="182" r="5" fill="#22d3ee"/>
  </g>

  <!-- current travelling along a trace (SMIL) -->
  <g filter="url(#heroGlow)">
    <circle class="pulse" cx="0" cy="0" r="3.4">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M120 108 H286 L316 138 H700 L730 108 H1080"/>
    </circle>
    <circle class="pulse" cx="0" cy="0" r="3">
      <animateMotion dur="7s" begin="2.2s" repeatCount="indefinite" path="M1080 212 H820 L790 182 H430 L400 212 H120"/>
    </circle>
  </g>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="120" height="320" fill="#22d3ee" opacity="0.08"/>

  <!-- title block -->
  <text class="prompt" x="120" y="132">$ whoami</text>
  <text class="title" x="118" y="184">XIE ZHIBAI</text>
  <text class="cn" x="520" y="184">木白</text>
  <rect class="caret" x="602" y="152" width="12" height="34" fill="#22d3ee"/>
  <text class="sub" x="120" y="238">ON-DEVICE INFERENCE · AGENT RUNTIME · DSH PLUGIN AUTHOR</text>
  <rect x="120" y="258" width="960" height="1.4" fill="url(#heroRule)"/>
</svg>